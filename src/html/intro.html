<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>위치룬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/intro.css" />
  </head>
  <body>
    <div class="ritual" id="ritual">
      <video
        class="ritual__video"
        id="ritual-video"
        src="/assets/video/ritual.mp4"
        muted
        autoplay
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
        controlslist="nodownload nofullscreen noremoteplayback"
      ></video>

      <div class="ritual__dim" id="ritual-dim" aria-hidden="true"></div>

      <canvas class="ritual__canvas" id="ritual-canvas" aria-hidden="true"></canvas>

      <p class="ritual__message" id="ritual-message" aria-live="polite" hidden>
        원을 그리세요
      </p>

      <div class="ritual__veil" id="ritual-veil" aria-hidden="true"></div>
    </div>

    <script type="module" src="/js/intro.js"></script>
  </body>
</html>
